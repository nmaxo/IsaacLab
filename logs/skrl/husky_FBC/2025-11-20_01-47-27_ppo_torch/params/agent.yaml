seed: 42
models:
  separate: false
  policy:
    class: GaussianMixin
    clip_actions: true
    clip_log_std: true
    min_log_std: -5.0
    max_log_std: 1.0
    initial_log_std: -0.5
    network:
    - name: net
      input: STATES
      layers:
      - 256
      - 256
      - 128
      activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: false
    network:
    - name: net
      input: STATES
      layers:
      - 256
      - 256
      - 128
      activations: elu
    output: ONE
memory:
  class: RandomMemory
  memory_size: -1
agent:
  class: PPO
  rollouts: 512
  learning_epochs: 4
  mini_batches: 8
  discount_factor: 0.997
  lambda: 0.95
  ratio_clip: 0.15
  value_clip: 0.25
  clip_predicted_values: true
  learning_rate: 0.00015
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
  state_preprocessor: RunningStandardScaler
  value_preprocessor: RunningStandardScaler
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 0.5
  entropy_loss_scale: 0.01
  value_loss_scale: 0.5
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: true
  experiment:
    directory: /home/maksim/IsaacLab/logs/skrl/husky_FBC
    experiment_name: 2025-11-20_01-47-27_ppo_torch
    write_interval: auto
    checkpoint_interval: auto
trainer:
  class: SequentialTrainer
  timesteps: 50000
  environment_info: log
  close_environment_at_exit: false
