env:
  viewer:
    eye:
    - 2.5
    - 2.5
    - 2.5
    lookat:
    - 0.0
    - 0.0
    - 0.0
    cam_prim_path: /OmniverseKit_Persp
    resolution:
    - 1280
    - 720
    origin_type: world
    env_index: 0
    asset_name: null
    body_name: null
  sim:
    physics_prim_path: /physicsScene
    device: cuda:0
    dt: 0.016666666666666666
    render_interval: 2
    gravity:
    - 0.0
    - 0.0
    - -9.81
    enable_scene_query_support: false
    use_fabric: true
    physx:
      solver_type: 1
      min_position_iteration_count: 1
      max_position_iteration_count: 255
      min_velocity_iteration_count: 0
      max_velocity_iteration_count: 255
      enable_ccd: false
      enable_stabilization: false
      enable_enhanced_determinism: false
      bounce_threshold_velocity: 0.5
      friction_offset_threshold: 0.04
      friction_correlation_distance: 0.025
      gpu_max_rigid_contact_count: 8388608
      gpu_max_rigid_patch_count: 163840
      gpu_found_lost_pairs_capacity: 2097152
      gpu_found_lost_aggregate_pairs_capacity: 33554432
      gpu_total_aggregate_pairs_capacity: 2097152
      gpu_collision_stack_size: 67108864
      gpu_heap_capacity: 67108864
      gpu_temp_buffer_capacity: 16777216
      gpu_max_num_partitions: 8
      gpu_max_soft_body_contacts: 1048576
      gpu_max_particle_contacts: 1048576
      solve_articulation_contact_last: false
    physics_material:
      func: isaaclab.sim.spawners.materials.physics_materials:spawn_rigid_body_material
      static_friction: 0.5
      dynamic_friction: 0.5
      restitution: 0.0
      friction_combine_mode: average
      restitution_combine_mode: average
      compliant_contact_stiffness: 0.0
      compliant_contact_damping: 0.0
    render:
      enable_translucency: null
      enable_reflections: null
      enable_global_illumination: null
      antialiasing_mode: null
      enable_dlssg: null
      enable_dl_denoiser: null
      dlss_mode: null
      enable_direct_lighting: null
      samples_per_pixel: null
      enable_shadows: null
      enable_ambient_occlusion: null
      carb_settings: null
      rendering_mode: null
    create_stage_in_memory: false
  ui_window_class_type: isaaclab.envs.ui.manager_based_rl_env_window:ManagerBasedRLEnvWindow
  seed: null
  decimation: 2
  scene:
    num_envs: 50
    env_spacing: 2.0
    lazy_sensor_update: true
    replicate_physics: true
    filter_collisions: true
    clone_in_fabric: false
    robot:
      class_type: isaaclab.assets.articulation.articulation:Articulation
      prim_path: '{ENV_REGEX_NS}/Robot'
      spawn:
        func: isaaclab.sim.spawners.from_files.from_files:spawn_from_usd
        visible: true
        semantic_tags: null
        copy_from_source: true
        mass_props: null
        deformable_props: null
        rigid_props: null
        collision_props: null
        activate_contact_sensors: false
        scale: null
        articulation_props: null
        fixed_tendons_props: null
        spatial_tendons_props: null
        joint_drive_props: null
        visual_material_path: material
        visual_material: null
        usd_path: https://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/Isaac/5.0/Isaac/Robots/NVIDIA/Jetbot/jetbot.usd
        variants: null
      init_state:
        pos:
        - 0.0
        - 0.0
        - 0.0
        rot:
        - 1.0
        - 0.0
        - 0.0
        - 0.0
        lin_vel:
        - 0.0
        - 0.0
        - 0.0
        ang_vel:
        - 0.0
        - 0.0
        - 0.0
        joint_pos:
          .*: 0.0
        joint_vel:
          .*: 0.0
      collision_group: 0
      debug_vis: false
      articulation_root_prim_path: null
      soft_joint_pos_limit_factor: 1.0
      actuators:
        wheel_acts:
          class_type: isaaclab.actuators.actuator_pd:ImplicitActuator
          joint_names_expr:
          - .*
          effort_limit: null
          velocity_limit: null
          effort_limit_sim: null
          velocity_limit_sim: null
          stiffness: null
          damping: null
          armature: null
          friction: null
          dynamic_friction: null
          viscous_friction: null
      actuator_value_resolution_debug_print: false
    ground:
      class_type: null
      prim_path: /World/ground
      spawn:
        func: isaaclab.sim.spawners.from_files.from_files:spawn_ground_plane
        visible: true
        semantic_tags: null
        copy_from_source: true
        usd_path: https://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/Isaac/5.0/Isaac/Environments/Grid/default_environment.usd
        color:
        - 0.0
        - 0.0
        - 0.0
        size:
        - 100.0
        - 100.0
        physics_material:
          func: isaaclab.sim.spawners.materials.physics_materials:spawn_rigid_body_material
          static_friction: 0.5
          dynamic_friction: 0.5
          restitution: 0.0
          friction_combine_mode: average
          restitution_combine_mode: average
          compliant_contact_stiffness: 0.0
          compliant_contact_damping: 0.0
      init_state:
        pos:
        - 0.0
        - 0.0
        - 0.0
        rot:
        - 1.0
        - 0.0
        - 0.0
        - 0.0
      collision_group: 0
      debug_vis: false
    light:
      class_type: null
      prim_path: /World/light
      spawn:
        func: isaaclab.sim.spawners.lights.lights:spawn_light
        visible: true
        semantic_tags: null
        copy_from_source: true
        prim_type: DomeLight
        color:
        - 0.75
        - 0.75
        - 0.75
        enable_color_temperature: false
        color_temperature: 6500.0
        normalize: false
        exposure: 0.0
        intensity: 2500.0
        texture_file: null
        texture_format: automatic
        visible_in_primary_ray: true
      init_state:
        pos:
        - 0.0
        - 0.0
        - 0.0
        rot:
        - 1.0
        - 0.0
        - 0.0
        - 0.0
      collision_group: 0
      debug_vis: false
  recorders:
    dataset_file_handler_class_type: isaaclab.utils.datasets.hdf5_dataset_file_handler:HDF5DatasetFileHandler
    dataset_export_dir_path: /tmp/isaaclab/logs
    dataset_filename: dataset
    dataset_export_mode:
      _value_: 1
      _name_: EXPORT_ALL
      _sort_order_: 1
    export_in_record_pre_reset: true
  observations:
    policy:
      concatenate_terms: true
      concatenate_dim: -1
      enable_corruption: false
      history_length: null
      flatten_history_dim: true
      base_lin_vel:
        func: isaaclab.envs.mdp.observations:base_lin_vel
        params: {}
        modifiers: null
        noise: null
        clip: null
        scale: null
        history_length: 0
        flatten_history_dim: true
      base_ang_vel:
        func: isaaclab.envs.mdp.observations:base_ang_vel
        params: {}
        modifiers: null
        noise: null
        clip: null
        scale: null
        history_length: 0
        flatten_history_dim: true
      pose_command:
        func: isaaclab.envs.mdp.observations:generated_commands
        params:
          command_name: pose_command
        modifiers: null
        noise: null
        clip: null
        scale: null
        history_length: 0
        flatten_history_dim: true
  actions:
    vel_actions:
      class_type: isaaclab_tasks.manager_based.navigation.mdp.custom_mdp:DiffDriveVelocityAction
      asset_name: robot
      debug_vis: false
      clip: null
      joint_names:
      - left_wheel_joint
      - right_wheel_joint
      scale: 1.0
      offset: 0.0
      preserve_order: false
      use_default_offset: false
      wheel_radius: 0.0325
      wheel_base: 0.1143
      max_linear_speed: 1.0
      max_angular_speed: 3.0
  events:
    reset_base:
      func: isaaclab.envs.mdp.events:reset_root_state_uniform
      params:
        pose_range:
          x:
          - -0.5
          - 0.5
          'y':
          - -0.5
          - 0.5
          yaw:
          - -3.141592653589793
          - 3.141592653589793
        velocity_range:
          x:
          - 0.0
          - 0.0
          'y':
          - 0.0
          - 0.0
          z:
          - 0.0
          - 0.0
          roll:
          - 0.0
          - 0.0
          pitch:
          - 0.0
          - 0.0
          yaw:
          - 0.0
          - 0.0
      mode: reset
      interval_range_s: null
      is_global_time: false
      min_step_count_between_reset: 0
  rerender_on_reset: false
  wait_for_textures: true
  xr: null
  teleop_devices:
    devices: {}
  export_io_descriptors: false
  log_dir: null
  is_finite_horizon: false
  episode_length_s: 12.0
  rewards:
    termination_penalty:
      func: isaaclab.envs.mdp.rewards:is_terminated
      params: {}
      weight: -400.0
    position_tracking:
      func: isaaclab_tasks.manager_based.navigation.mdp.rewards:position_command_error_tanh
      params:
        std: 1.0
        command_name: pose_command
      weight: 0.8
    position_tracking_fine_grained:
      func: isaaclab_tasks.manager_based.navigation.mdp.rewards:position_command_error_tanh
      params:
        std: 0.1
        command_name: pose_command
      weight: 1.0
    orientation_tracking:
      func: isaaclab_tasks.manager_based.navigation.mdp.rewards:heading_command_error_abs
      params:
        command_name: pose_command
      weight: -0.2
    stability_at_goal:
      func: isaaclab_tasks.manager_based.navigation.mdp.rewards:stability_reward
      params:
        command_name: pose_command
        position_threshold: 0.15
        orientation_threshold: 0.3
        lin_velocity_threshold: 0.15
        ang_velocity_threshold: 0.3
      weight: 0.3
    vel_pen:
      func: isaaclab_tasks.manager_based.navigation.mdp.rewards:distance_based_velocity_penalty
      params:
        command_name: pose_command
      weight: -0.15
  terminations:
    time_out:
      func: isaaclab.envs.mdp.terminations:time_out
      params: {}
      time_out: true
  curriculum: null
  commands:
    pose_command:
      class_type: isaaclab.envs.mdp.commands.pose_2d_command:UniformPose2dCommand
      resampling_time_range:
      - 12.0
      - 12.0
      debug_vis: true
      asset_name: robot
      simple_heading: false
      ranges:
        pos_x:
        - -2.0
        - 2.0
        pos_y:
        - -2.0
        - 2.0
        heading:
        - -3.141592653589793
        - 3.141592653589793
      goal_pose_visualizer_cfg:
        prim_path: /Visuals/Command/pose_goal
        markers:
          arrow:
            func: isaaclab.sim.spawners.from_files.from_files:spawn_from_usd
            visible: true
            semantic_tags: null
            copy_from_source: true
            mass_props: null
            deformable_props: null
            rigid_props: null
            collision_props: null
            activate_contact_sensors: false
            scale:
            - 0.2
            - 0.2
            - 0.8
            articulation_props: null
            fixed_tendons_props: null
            spatial_tendons_props: null
            joint_drive_props: null
            visual_material_path: material
            visual_material:
              func: isaaclab.sim.spawners.materials.visual_materials:spawn_preview_surface
              diffuse_color:
              - 0.0
              - 1.0
              - 0.0
              emissive_color:
              - 0.0
              - 0.0
              - 0.0
              roughness: 0.5
              metallic: 0.0
              opacity: 1.0
            usd_path: https://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/Isaac/5.0/Isaac/Props/UIElements/arrow_x.usd
            variants: null
agent:
  seed: 42
  device: cuda:0
  num_steps_per_env: 8
  max_iterations: 1500
  empirical_normalization: null
  obs_groups: {}
  clip_actions: null
  save_interval: 50
  experiment_name: Jetbot_nav
  run_name: ''
  logger: tensorboard
  neptune_project: isaaclab
  wandb_project: isaaclab
  resume: false
  load_run: .*
  load_checkpoint: model_.*.pt
  class_name: OnPolicyRunner
  policy:
    class_name: ActorCritic
    init_noise_std: 0.5
    noise_std_type: scalar
    actor_obs_normalization: false
    critic_obs_normalization: false
    actor_hidden_dims:
    - 256
    - 256
    critic_hidden_dims:
    - 128
    - 128
    activation: elu
  algorithm:
    class_name: PPO
    num_learning_epochs: 5
    num_mini_batches: 128
    learning_rate: 0.001
    schedule: adaptive
    gamma: 0.99
    lam: 0.95
    entropy_coef: 0.005
    desired_kl: 0.01
    max_grad_norm: 1.0
    value_loss_coef: 1.0
    use_clipped_value_loss: true
    clip_param: 0.2
    normalize_advantage_per_mini_batch: false
    rnd_cfg: null
    symmetry_cfg: null
